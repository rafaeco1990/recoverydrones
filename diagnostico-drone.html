<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Drone | Recovery Drones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Diagnóstico rápido do drone</h1>
    <form onsubmit="enviarDiagnostico(event)">
      <label for="modelo">Modelo do drone</label>
      <select id="modelo" required>
  <option value="">Selecione</option>

  <optgroup label="Mini">
    <option>DJI Mini SE</option>
    <option>DJI Mini 2</option>
    <option>DJI Mini 2 SE</option>
    <option>DJI Mini 3</option>
    <option>DJI Mini 3 Pro</option>
    <option>DJI Mini 4 Pro</option>
    <option>DJI Mini 4K</option>
  </optgroup>

  <optgroup label="Air">
    <option>DJI Air</option>
    <option>DJI Air 2</option>
    <option>DJI Air 2S</option>
    <option>DJI Air 3</option>
    <option>DJI Air 3S</option>
  </optgroup>

  <optgroup label="Mavic">
    <option>DJI Mavic Pro</option>
    <option>DJI Mavic Pro Platinum</option>
    <option>DJI Mavic Air</option>
    <option>DJI Mavic 2 Pro</option>
    <option>DJI Mavic 2 Zoom</option>
    <option>DJI Mavic 3</option>
    <option>DJI Mavic 3 Classic</option>
    <option>DJI Mavic 3 Pro</option>
  </optgroup>

  <optgroup label="FPV / Avata">
    <option>DJI FPV</option>
    <option>DJI Avata</option>
    <option>DJI Avata 2</option>
  </optgroup>

  <optgroup label="Modelos compactos e novos">
    <option>DJI Neo</option>
    <option>DJI Flip</option>
  </optgroup>

  <optgroup label="Phantom e Spark">
    <option>DJI Spark</option>
    <option>DJI Phantom 3 Standard</option>
    <option>DJI Phantom 3 Advanced</option>
    <option>DJI Phantom 3 Professional</option>
    <option>DJI Phantom 4</option>
    <option>DJI Phantom 4 Advanced</option>
    <option>DJI Phantom 4 Pro</option>
    <option>DJI Phantom 4 Pro V2.0</option>
  </optgroup>

  <optgroup label="Inspire">
    <option>DJI Inspire 1</option>
    <option>DJI Inspire 1 Pro</option>
    <option>DJI Inspire 1 Raw</option>
    <option>DJI Inspire 2</option>
    <option>DJI Inspire 3</option>
  </optgroup>

  <optgroup label="Enterprise / Matrice">
    <option>DJI Mavic 2 Enterprise</option>
    <option>DJI Mavic 2 Enterprise Advanced</option>
    <option>DJI Mavic 3 Enterprise</option>
    <option>DJI Mavic 3 Thermal</option>
    <option>DJI Matrice 30</option>
    <option>DJI Matrice 30T</option>
    <option>DJI Matrice 300 RTK</option>
    <option>DJI Matrice 350 RTK</option>
  </optgroup>

  <option>Outro modelo DJI</option>
  <option>Não sei o modelo</option>
</select>
      <label for="problema">Tipo principal do problema</label>
      <select id="problema" required>
        <option value="">Selecione</option>
        <option>Queda / impacto</option>
        <option>Caiu na água</option>
        <option>Não liga</option>
        <option>Erro de gimbal</option>
        <option>Braço / carcaça quebrada</option>
        <option>Problema na bateria</option>
        <option>Erro na câmera</option>
        <option>Falha eletrônica / placa</option>
        <option>Outro defeito</option>
      </select>
      <label for="liga">O drone liga?</label>
      <select id="liga" required>
        <option value="">Selecione</option>
        <option>Sim</option>
        <option>Não</option>
        <option>Liga às vezes</option>
      </select>
      <label for="cidade">Sua cidade</label>
      <input id="cidade" type="text" required>
      <label for="detalhes">Descreva rapidamente o que aconteceu</label>
      <textarea id="detalhes"></textarea>
      <button type="submit">Enviar no WhatsApp</button>
    </form>
  </main>
  <script>
    function enviarDiagnostico(event){
      event.preventDefault();
      const modelo = document.getElementById('modelo').value.trim();
      const problema = document.getElementById('problema').value.trim();
      const liga = document.getElementById('liga').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const detalhes = document.getElementById('detalhes').value.trim();
      let msg = "Olá! Já fiz o diagnóstico no site 👇\n";
      msg += "Modelo: " + modelo + "\n";
      msg += "Problema: " + problema + "\n";
      msg += "Liga: " + liga + "\n";
      msg += "Cidade: " + cidade + "\n";
      if (detalhes) msg += "Detalhes: " + detalhes;
      window.location.href = "https://wa.me/55997144004?text=" + encodeURIComponent(msg);
    }
  </script>
</body>
</html>
